<!doctype html><meta charset="utf-8"><title>R2 Content verification</title><h1>R2 Content verification</h1><p>This read-only check compares public R2 file sizes with the original Content inventory. It does not read local game folders or change saves.</p><pre id="results">Checking…</pre><script src="content-verify.js"></script><script>
(async()=>{const out=document.querySelector('#results');out.textContent='';try{const manifest=await (await fetch('./content-manifest.json',{cache:'no-store'})).json();const rows=await verifyRemoteContent(manifest,row=>{out.textContent+=JSON.stringify(row)+'\n';});const file=manifest.files.find(f=>f.path.endsWith('.obb'));const response=await fetch(new URL(file.path,manifest.baseURL),{headers:{Range:'bytes=0-31'}});if(response.status!==206) {await response.body?.cancel();throw Error('Range unsupported: '+response.status)}const range=response.headers.get('Content-Range');const bytes=await response.arrayBuffer();if(range!=='bytes 0-31/'+file.size||bytes.byteLength!==32)throw Error('Invalid range response: '+range);out.textContent+='PASS: '+rows.length+' files, '+rows.reduce((n,r)=>n+r.actual,0)+' bytes; public CORS and Range verified.\n';}catch(error){out.textContent+='FAIL: '+error.message;}})();
</script>
